<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>記帳本</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap');

  :root {
    --bg: #0f0f13;
    --surface: #1a1a22;
    --surface2: #22222e;
    --border: #2e2e3e;
    --accent-green: #00e5a0;
    --accent-red: #ff4d6d;
    --accent-blue: #4d9fff;
    --text: #e8e8f0;
    --text-muted: #6b6b88;
    --radius: 16px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    max-width: 480px;
    margin: 0 auto;
    padding-bottom: 100px;
  }

  /* Header */
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 20px 20px 0;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(10px);
  }

  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }

  .app-title {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.5px;
  }

  .month-nav {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .month-nav button {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    width: 32px;
    height: 32px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }

  .month-nav button:active { transform: scale(0.92); background: var(--border); }

  .month-label {
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    color: var(--text-muted);
    min-width: 80px;
    text-align: center;
  }

  /* Summary cards */
  .summary {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    padding: 16px 20px;
  }

  .summary-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 10px;
    text-align: center;
  }

  .summary-card .label {
    font-size: 10px;
    color: var(--text-muted);
    margin-bottom: 6px;
    letter-spacing: 0.5px;
  }

  .summary-card .amount {
    font-family: 'DM Mono', monospace;
    font-size: 14px;
    font-weight: 500;
  }

  .income-amount { color: var(--accent-green); }
  .expense-amount { color: var(--accent-red); }
  .balance-pos { color: var(--accent-blue); }
  .balance-neg { color: var(--accent-red); }

  /* Tabs */
  .tabs {
    display: flex;
    padding: 0 20px 0;
    gap: 0;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }

  .tab {
    flex: 1;
    padding: 10px;
    text-align: center;
    font-size: 13px;
    color: var(--text-muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
  }

  .tab.active {
    color: var(--text);
    border-bottom-color: var(--accent-green);
  }

  /* Content sections */
  .section { display: none; padding: 16px 20px; }
  .section.active { display: block; }

  /* Add form */
  .form-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 16px;
  }

  .type-toggle {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }

  .type-btn {
    flex: 1;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-muted);
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .type-btn.active-income {
    background: rgba(0, 229, 160, 0.15);
    border-color: var(--accent-green);
    color: var(--accent-green);
    font-weight: 500;
  }

  .type-btn.active-expense {
    background: rgba(255, 77, 109, 0.15);
    border-color: var(--accent-red);
    color: var(--accent-red);
    font-weight: 500;
  }

  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 8px;
  }

  .form-full { margin-bottom: 8px; }

  input, select, textarea {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 14px;
    padding: 10px 12px;
    outline: none;
    transition: border-color 0.2s;
    -webkit-appearance: none;
  }

  input:focus, select:focus, textarea:focus {
    border-color: var(--accent-green);
  }

  select option { background: #1a1a22; }

  textarea { resize: none; height: 60px; }

  .amount-input-wrap {
    position: relative;
  }

  .amount-input-wrap .currency {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    font-size: 13px;
  }

  .amount-input-wrap input {
    padding-left: 28px;
    font-family: 'DM Mono', monospace;
    font-size: 15px;
  }

  .submit-btn {
    width: 100%;
    padding: 13px;
    border-radius: 10px;
    border: none;
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    margin-top: 8px;
    transition: all 0.2s;
  }

  .submit-btn:active { transform: scale(0.98); }

  .btn-income { background: var(--accent-green); color: #001a12; }
  .btn-expense { background: var(--accent-red); color: #fff; }

  /* Transactions list */
  .date-group { margin-bottom: 20px; }

  .date-header {
    font-size: 11px;
    color: var(--text-muted);
    font-family: 'DM Mono', monospace;
    letter-spacing: 1px;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .date-total {
    font-size: 11px;
    color: var(--text-muted);
  }

  .tx-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 6px;
    position: relative;
    overflow: hidden;
    transition: transform 0.15s;
  }

  .tx-item:active { transform: scale(0.99); }

  .tx-icon {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }

  .tx-icon.income { background: rgba(0, 229, 160, 0.12); }
  .tx-icon.expense { background: rgba(255, 77, 109, 0.12); }

  .tx-info { flex: 1; min-width: 0; }

  .tx-title {
    font-size: 14px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .tx-cat {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 2px;
  }

  .tx-right { text-align: right; flex-shrink: 0; }

  .tx-amount {
    font-family: 'DM Mono', monospace;
    font-size: 14px;
    font-weight: 500;
  }

  .tx-time {
    font-size: 10px;
    color: var(--text-muted);
    margin-top: 2px;
  }

  .tx-delete {
    position: absolute;
    right: 0;
    top: 0;
    bottom: 0;
    width: 56px;
    background: var(--accent-red);
    border: none;
    color: white;
    font-size: 18px;
    cursor: pointer;
    transform: translateX(100%);
    transition: transform 0.2s;
    border-radius: 0 12px 12px 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .tx-item.swiped .tx-delete { transform: translateX(0); }

  /* Chart section */
  .chart-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 16px;
  }

  .chart-title {
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 14px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .cat-bar { margin-bottom: 10px; }

  .cat-bar-top {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    margin-bottom: 5px;
  }

  .cat-bar-name { color: var(--text); }
  .cat-bar-val { font-family: 'DM Mono', monospace; color: var(--text-muted); }

  .bar-track {
    height: 6px;
    background: var(--surface2);
    border-radius: 3px;
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    border-radius: 3px;
    transition: width 0.6s ease;
  }

  /* Export section */
  .export-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 12px;
  }

  .export-title {
    font-size: 15px;
    font-weight: 500;
    margin-bottom: 6px;
  }

  .export-desc {
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 14px;
    line-height: 1.6;
  }

  .export-btn {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: none;
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    background: rgba(77, 159, 255, 0.15);
    border: 1px solid var(--accent-blue);
    color: var(--accent-blue);
    transition: all 0.2s;
  }

  .export-btn:active { transform: scale(0.98); background: rgba(77, 159, 255, 0.25); }

  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-muted);
  }

  .empty-state .icon { font-size: 40px; margin-bottom: 10px; }
  .empty-state p { font-size: 14px; line-height: 1.6; }

  /* Bottom nav */
  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 480px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex;
    padding: 8px 0 20px;
    z-index: 200;
  }

  .nav-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 6px;
    cursor: pointer;
    color: var(--text-muted);
    transition: color 0.2s;
  }

  .nav-item.active { color: var(--accent-green); }
  .nav-item .nav-icon { font-size: 20px; }
  .nav-item .nav-label { font-size: 10px; }

  /* Filter chips */
  .filter-row {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 8px;
    margin-bottom: 12px;
    scrollbar-width: none;
  }

  .filter-row::-webkit-scrollbar { display: none; }

  .chip {
    padding: 6px 12px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-muted);
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 12px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s;
  }

  .chip.active {
    background: rgba(0, 229, 160, 0.15);
    border-color: var(--accent-green);
    color: var(--accent-green);
  }

  /* Note modal */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 300;
    align-items: flex-end;
    backdrop-filter: blur(4px);
  }

  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--surface);
    border-radius: 20px 20px 0 0;
    padding: 20px;
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    border-top: 1px solid var(--border);
  }

  .modal h3 { font-size: 16px; margin-bottom: 14px; }

  .modal-note {
    font-size: 13px;
    color: var(--text-muted);
    line-height: 1.6;
    background: var(--surface2);
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 14px;
  }

  .modal-close {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 14px;
    cursor: pointer;
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="app-title">💰 記帳本</div>
    <div class="month-nav">
      <button onclick="changeMonth(-1)">‹</button>
      <span class="month-label" id="monthLabel"></span>
      <button onclick="changeMonth(1)">›</button>
    </div>
  </div>

  <div class="summary">
    <div class="summary-card">
      <div class="label">收入</div>
      <div class="amount income-amount" id="totalIncome">$0</div>
    </div>
    <div class="summary-card">
      <div class="label">支出</div>
      <div class="amount expense-amount" id="totalExpense">$0</div>
    </div>
    <div class="summary-card">
      <div class="label">結餘</div>
      <div class="amount" id="totalBalance">$0</div>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('add')">➕ 新增</div>
    <div class="tab" onclick="switchTab('list')">📋 明細</div>
    <div class="tab" onclick="switchTab('stats')">📊 統計</div>
    <div class="tab" onclick="switchTab('export')">📤 匯出</div>
  </div>
</div>

<!-- ADD TAB -->
<div class="section active" id="tab-add">
  <div class="form-card">
    <div class="type-toggle">
      <button class="type-btn active-expense" id="btn-expense" onclick="setType('expense')">💸 支出</button>
      <button class="type-btn" id="btn-income" onclick="setType('income')">💵 收入</button>
    </div>

    <div class="form-full">
      <div class="amount-input-wrap">
        <span class="currency">$</span>
        <input type="number" id="amount" placeholder="0" inputmode="decimal" min="0" step="0.01">
      </div>
    </div>

    <div class="form-row">
      <select id="category"></select>
      <input type="date" id="txDate">
    </div>

    <div class="form-full">
      <input type="text" id="desc" placeholder="備註（選填）" maxlength="50">
    </div>

    <button class="submit-btn btn-expense" id="submitBtn" onclick="addTransaction()">記帳</button>
  </div>
</div>

<!-- LIST TAB -->
<div class="section" id="tab-list">
  <div class="filter-row">
    <button class="chip active" onclick="setFilter('all', this)">全部</button>
    <button class="chip" onclick="setFilter('income', this)">收入</button>
    <button class="chip" onclick="setFilter('expense', this)">支出</button>
  </div>
  <div id="txList"></div>
</div>

<!-- STATS TAB -->
<div class="section" id="tab-stats">
  <div class="chart-wrap">
    <div class="chart-title">支出分類</div>
    <div id="expenseChart"></div>
  </div>
  <div class="chart-wrap">
    <div class="chart-title">收入分類</div>
    <div id="incomeChart"></div>
  </div>
</div>

<!-- EXPORT TAB -->
<div class="section" id="tab-export">
  <div class="export-card">
    <div class="export-title">📅 匯出本月</div>
    <div class="export-desc">匯出目前選擇月份的所有收支記錄，格式為 Excel (.xlsx)，包含明細與統計摘要。</div>
    <button class="export-btn" onclick="exportExcel('month')">下載本月 Excel</button>
  </div>
  <div class="export-card">
    <div class="export-title">📦 匯出全部</div>
    <div class="export-desc">匯出所有月份的完整記錄，依月份分頁排列，方便長期追蹤。</div>
    <button class="export-btn" onclick="exportExcel('all')">下載完整記錄 Excel</button>
  </div>
</div>

<!-- Note Modal -->
<div class="modal-overlay" id="noteModal" onclick="closeModal()">
  <div class="modal" onclick="event.stopPropagation()">
    <h3 id="modalTitle">備註</h3>
    <div class="modal-note" id="modalNote"></div>
    <button class="modal-close" onclick="closeModal()">關閉</button>
  </div>
</div>

<script>
// ============ DATA ============
const CATS = {
  expense: ['🍱 餐飲', '🚌 交通', '🛍️ 購物', '🏠 居家', '💊 醫療', '🎮 娛樂', '📚 教育', '💡 水電', '💰 投資', '📦 其他'],
  income:  ['💼 薪資', '📈 投資報酬', '🎁 獎金', '🏠 租金', '💸 副業', '🎀 禮金', '📦 其他']
};

const CAT_COLORS = {
  '🍱 餐飲': '#ff9f43', '🚌 交通': '#54a0ff', '🛍️ 購物': '#ff6b9d',
  '🏠 居家': '#a29bfe', '💊 醫療': '#00cec9', '🎮 娛樂': '#fd79a8',
  '📚 教育': '#fdcb6e', '💡 水電': '#6c5ce7', '💰 投資': '#00b894',
  '💼 薪資': '#00e5a0', '📈 投資報酬': '#4d9fff', '🎁 獎金': '#f9ca24',
  '🏠 租金': '#a29bfe', '💸 副業': '#fd79a8', '🎀 禮金': '#ff7675', '📦 其他': '#636e72'
};

let currentType = 'expense';
let currentFilter = 'all';
let currentMonth; // YYYY-MM
let transactions = JSON.parse(localStorage.getItem('txData') || '[]');

function save() {
  localStorage.setItem('txData', JSON.stringify(transactions));
}

// ============ INIT ============
(function init() {
  const now = new Date();
  currentMonth = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  document.getElementById('txDate').value = now.toISOString().split('T')[0];
  updateMonthLabel();
  updateCategoryOptions();
  renderAll();
})();

function updateMonthLabel() {
  const [y, m] = currentMonth.split('-');
  document.getElementById('monthLabel').textContent = `${y}/${m}`;
}

function changeMonth(d) {
  const [y, m] = currentMonth.split('-').map(Number);
  const date = new Date(y, m - 1 + d, 1);
  currentMonth = `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}`;
  updateMonthLabel();
  renderAll();
}

function renderAll() {
  updateSummary();
  renderList();
  renderCharts();
}

// ============ TYPE ============
function setType(type) {
  currentType = type;
  const btnE = document.getElementById('btn-expense');
  const btnI = document.getElementById('btn-income');
  const sub  = document.getElementById('submitBtn');

  if (type === 'expense') {
    btnE.className = 'type-btn active-expense';
    btnI.className = 'type-btn';
    sub.className  = 'submit-btn btn-expense';
  } else {
    btnI.className = 'type-btn active-income';
    btnE.className = 'type-btn';
    sub.className  = 'submit-btn btn-income';
  }
  updateCategoryOptions();
}

function updateCategoryOptions() {
  const sel = document.getElementById('category');
  const cats = CATS[currentType];
  sel.innerHTML = cats.map(c => `<option value="${c}">${c}</option>`).join('');
}

// ============ ADD ============
function addTransaction() {
  const amount = parseFloat(document.getElementById('amount').value);
  const category = document.getElementById('category').value;
  const date = document.getElementById('txDate').value;
  const desc = document.getElementById('desc').value.trim();

  if (!amount || amount <= 0) { alert('請輸入金額'); return; }
  if (!date) { alert('請選擇日期'); return; }

  const tx = {
    id: Date.now(),
    type: currentType,
    amount,
    category,
    date,
    desc,
    time: new Date().toLocaleTimeString('zh-TW', {hour:'2-digit', minute:'2-digit'})
  };

  transactions.unshift(tx);
  save();

  document.getElementById('amount').value = '';
  document.getElementById('desc').value = '';

  // feedback animation
  const btn = document.getElementById('submitBtn');
  btn.textContent = '✓ 已記錄！';
  setTimeout(() => btn.textContent = '記帳', 1200);

  // update month to match entry date
  currentMonth = date.substring(0, 7);
  updateMonthLabel();
  renderAll();
  switchTab('list');
}

// ============ SUMMARY ============
function updateSummary() {
  const txs = getMonthTxs();
  const income  = txs.filter(t => t.type === 'income').reduce((s, t) => s + t.amount, 0);
  const expense = txs.filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0);
  const balance = income - expense;

  document.getElementById('totalIncome').textContent  = fmt(income);
  document.getElementById('totalExpense').textContent = fmt(expense);
  const balEl = document.getElementById('totalBalance');
  balEl.textContent = fmt(Math.abs(balance));
  balEl.className = 'amount ' + (balance >= 0 ? 'balance-pos' : 'balance-neg');
}

function fmt(n) {
  if (n >= 10000) return '$' + (n/10000).toFixed(1) + 'w';
  return '$' + n.toLocaleString('zh-TW', {maximumFractionDigits: 0});
}

function fmtFull(n) {
  return '$' + n.toLocaleString('zh-TW', {minimumFractionDigits: 0, maximumFractionDigits: 0});
}

// ============ LIST ============
function getMonthTxs() {
  return transactions.filter(t => t.date.startsWith(currentMonth));
}

function setFilter(f, el) {
  currentFilter = f;
  document.querySelectorAll('.filter-row .chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  renderList();
}

function renderList() {
  let txs = getMonthTxs();
  if (currentFilter !== 'all') txs = txs.filter(t => t.type === currentFilter);

  const container = document.getElementById('txList');
  if (txs.length === 0) {
    container.innerHTML = `<div class="empty-state"><div class="icon">📭</div><p>本月還沒有記錄<br>點擊「新增」開始記帳吧！</p></div>`;
    return;
  }

  // Group by date
  const groups = {};
  txs.forEach(t => {
    if (!groups[t.date]) groups[t.date] = [];
    groups[t.date].push(t);
  });

  const sortedDates = Object.keys(groups).sort((a,b) => b.localeCompare(a));

  container.innerHTML = sortedDates.map(date => {
    const dayTxs = groups[date];
    const dayIncome  = dayTxs.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
    const dayExpense = dayTxs.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
    const net = dayIncome - dayExpense;

    const dateObj = new Date(date + 'T00:00:00');
    const weekdays = ['週日','週一','週二','週三','週四','週五','週六'];
    const dateLabel = `${date.replace(/-/g,'/')} ${weekdays[dateObj.getDay()]}`;
    const netLabel = net >= 0
      ? `<span style="color:var(--accent-green)">+${fmtFull(net)}</span>`
      : `<span style="color:var(--accent-red)">${fmtFull(net)}</span>`;

    const items = dayTxs.map(t => `
      <div class="tx-item" id="tx-${t.id}" onclick="toggleSwipe(${t.id})">
        <div class="tx-icon ${t.type}">${t.category.split(' ')[0]}</div>
        <div class="tx-info">
          <div class="tx-title">${t.category.split(' ').slice(1).join(' ')}${t.desc ? ' — ' + t.desc : ''}</div>
          <div class="tx-cat">${t.type === 'income' ? '收入' : '支出'}</div>
        </div>
        <div class="tx-right">
          <div class="tx-amount ${t.type === 'income' ? 'income-amount' : 'expense-amount'}">
            ${t.type === 'income' ? '+' : '-'}${fmtFull(t.amount)}
          </div>
          <div class="tx-time">${t.time || ''}</div>
        </div>
        <button class="tx-delete" onclick="deleteTx(event, ${t.id})">🗑️</button>
      </div>
    `).join('');

    return `
      <div class="date-group">
        <div class="date-header">
          <span>${dateLabel}</span>
          <span class="date-total">${netLabel}</span>
        </div>
        ${items}
      </div>
    `;
  }).join('');
}

function toggleSwipe(id) {
  const el = document.getElementById('tx-' + id);
  el.classList.toggle('swiped');
}

function deleteTx(e, id) {
  e.stopPropagation();
  if (!confirm('確定刪除此筆記錄？')) return;
  transactions = transactions.filter(t => t.id !== id);
  save();
  renderAll();
}

// ============ CHARTS ============
function renderCharts() {
  const txs = getMonthTxs();
  renderCatChart('expenseChart', txs.filter(t=>t.type==='expense'));
  renderCatChart('incomeChart', txs.filter(t=>t.type==='income'));
}

function renderCatChart(containerId, txs) {
  const container = document.getElementById(containerId);
  if (txs.length === 0) {
    container.innerHTML = '<div style="text-align:center;color:var(--text-muted);font-size:13px;padding:10px">無資料</div>';
    return;
  }

  const totals = {};
  txs.forEach(t => totals[t.category] = (totals[t.category] || 0) + t.amount);
  const max = Math.max(...Object.values(totals));
  const sorted = Object.entries(totals).sort((a,b) => b[1]-a[1]);

  container.innerHTML = sorted.map(([cat, val]) => {
    const pct = (val / max * 100).toFixed(0);
    const color = CAT_COLORS[cat] || '#636e72';
    return `
      <div class="cat-bar">
        <div class="cat-bar-top">
          <span class="cat-bar-name">${cat}</span>
          <span class="cat-bar-val">${fmtFull(val)}</span>
        </div>
        <div class="bar-track">
          <div class="bar-fill" style="width:${pct}%;background:${color}"></div>
        </div>
      </div>
    `;
  }).join('');
}

// ============ EXPORT ============
function exportExcel(scope) {
  const wb = XLSX.utils.book_new();

  if (scope === 'month') {
    const txs = getMonthTxs();
    addMonthSheet(wb, currentMonth, txs);
  } else {
    // Group by month
    const byMonth = {};
    transactions.forEach(t => {
      const m = t.date.substring(0, 7);
      if (!byMonth[m]) byMonth[m] = [];
      byMonth[m].push(t);
    });

    const months = Object.keys(byMonth).sort((a,b) => b.localeCompare(a));
    months.forEach(m => addMonthSheet(wb, m, byMonth[m]));

    // Summary sheet
    const sumRows = [['月份', '收入', '支出', '結餘']];
    months.forEach(m => {
      const txs = byMonth[m];
      const inc = txs.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
      const exp = txs.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
      sumRows.push([m, inc, exp, inc - exp]);
    });
    const sumWs = XLSX.utils.aoa_to_sheet(sumRows);
    sumWs['!cols'] = [{wch:12},{wch:14},{wch:14},{wch:14}];
    XLSX.utils.book_append_sheet(wb, sumWs, '月份總覽');
  }

  const filename = scope === 'month'
    ? `記帳本_${currentMonth}.xlsx`
    : `記帳本_全部_${new Date().toLocaleDateString('zh-TW').replace(/\//g,'-')}.xlsx`;

  XLSX.writeFile(wb, filename);
}

function addMonthSheet(wb, month, txs) {
  // Details sheet
  const rows = [['日期', '類型', '分類', '金額', '備註', '時間']];
  const sorted = [...txs].sort((a,b) => b.date.localeCompare(a.date));
  sorted.forEach(t => {
    rows.push([
      t.date,
      t.type === 'income' ? '收入' : '支出',
      t.category,
      t.type === 'income' ? t.amount : -t.amount,
      t.desc || '',
      t.time || ''
    ]);
  });

  // Add summary rows
  const income  = txs.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
  const expense = txs.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
  rows.push([]);
  rows.push(['', '收入合計', '', income]);
  rows.push(['', '支出合計', '', expense]);
  rows.push(['', '結餘', '', income - expense]);

  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = [{wch:12},{wch:8},{wch:14},{wch:12},{wch:20},{wch:8}];
  XLSX.utils.book_append_sheet(wb, ws, month);
}

// ============ TABS ============
function switchTab(name) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  const idx = ['add','list','stats','export'].indexOf(name);
  document.querySelectorAll('.tab')[idx].classList.add('active');
  if (name === 'stats') renderCharts();
}

function closeModal() {
  document.getElementById('noteModal').classList.remove('open');
}
</script>
